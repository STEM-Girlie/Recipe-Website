<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe App</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="mobile-container">
      <header>
        <input
          type="text"
          id="search-term"
          placeholder="Search for a recipe..."
        />
        <button id="search-button">
          <i class="fa-brands fa-sistrix"></i>
        </button>
      </header>

      <div class="fav-container">
        <h3><span class="fav-title">Favourite Recipes</span></h3>

        <ul class="fav-meals" id="fav-meals"></ul>
      </div>
      <div class="meals" id="meals"></div>
    </div>

    <div id="meal-popup" class="recipe-card-container">
      <div id="recipe-card-content" class="recipe-card-content">
        <button id="close-popup" class="close-popup">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <h2 class="recipe-title">Recipe Title</h2>
        <img class="recipe-image" src="" alt="" />
        <h3>Instructions</h3>
        <p class="recipe-instructions">
          lore ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod
          tempor incididunt ut labore et dolore magna aliqua.
        </p>
        <h3>Ingredients</h3>
        <ul class="recipe-ingredients">
          <li>Ingredient 1</li>
          <li>Ingredient 2</li>
          <li>Ingredient 3</li>
        </ul>
      </div>
    </div>
  </body>
</html>
